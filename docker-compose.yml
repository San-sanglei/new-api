# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line 15
#   2. Uncomment the mysql service and SQL_DSN line 16
#   3. Uncomment mysql in depends_on (line 28)
#   4. Uncomment mysql_data in volumes section (line 64)
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!
#
# 推荐做法：在与 docker-compose.yml 同级目录创建 .env 文件，写入：
#   POSTGRES_PASSWORD=<强密码>
#   REDIS_PASSWORD=<强密码>
# docker-compose 会自动加载 .env 文件并完成变量替换。
# 生产安全策略：未设置 POSTGRES_PASSWORD / REDIS_PASSWORD 时 docker-compose 启动失败（fail-closed）。
# 本地调试也必须创建 .env 文件并设置这两个变量。

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    # 禁止使用 :latest 标签：生产环境必须使用明确的版本号
    # 默认构建本地 Dockerfile（已含 digest 锁定、非 root 用户等安全加固）
    # 通过 NEW_API_VERSION 环境变量指定版本 tag，便于版本追踪与回滚
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api:${NEW_API_VERSION:-v0.6.0}
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env before starting}@postgres:5432/new-api # 生产环境必须通过 POSTGRES_PASSWORD 注入强密码
#      - SQL_DSN=root:${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env before starting}@redis:6379 # 生产环境必须通过 REDIS_PASSWORD 注入强密码
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    # 固定主版本，使用 alpine 变体减小攻击面与镜像体积
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env before starting}"]  # 密码必须通过 REDIS_PASSWORD 注入
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env before starting}  # 密码必须通过 POSTGRES_PASSWORD 注入
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

  # ---------------------------------------------------------------------------
  # 数据库定时备份服务
  #
  # 功能：每天凌晨 3:00 自动执行 PostgreSQL 逻辑备份，保留最近 7 天
  # 备份文件存储在 ./backups 目录（通过 volume 挂载）
  #
  # 自定义备份频率：修改 BACKUP_RETAIN_DAYS / cron 表达式环境变量
  # 手动执行备份：docker compose run --rm db-backup
  # 手动恢复：见 scripts/restore.sh
  # ---------------------------------------------------------------------------
  db-backup:
    image: postgres:15
    container_name: db-backup
    restart: always
    depends_on:
      - postgres
    environment:
      # 使用与 postgres 服务相同的凭据
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env before starting}
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=root
      - PGDATABASE=new-api
      # 备份保留天数，默认 7 天
      - BACKUP_RETAIN_DAYS=${BACKUP_RETAIN_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache dcron
        echo "0 3 * * * /scripts/docker-backup-cron.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "数据库定时备份服务已启动（每天 03:00 执行）"
        crond -f -l 2
    networks:
      - new-api-network

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      - MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}  # 密码必须通过 MYSQL_PASSWORD 注入
#      MYSQL_DATABASE: new-api
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - new-api-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

volumes:
  pg_data:
#  mysql_data:

networks:
  new-api-network:
    driver: bridge
