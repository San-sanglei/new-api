<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Took Logo 预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
  }
  h1 { text-align: center; font-size: 28px; margin-bottom: 40px; font-weight: 600; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    transition: all 0.2s;
  }
  .card:hover {
    border-color: #6366f1;
    transform: translateY(-2px);
  }
  .card svg {
    width: 120px;
    height: 120px;
    display: block;
    margin: 0 auto 20px;
  }
  .card h3 { font-size: 18px; margin-bottom: 8px; font-weight: 600; }
  .card p { font-size: 13px; color: #9ca3af; line-height: 1.5; }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .sizes {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #27272a;
  }
  .sizes svg { width: 16px; height: 16px; margin: 0; }
  .sizes span { font-size: 11px; color: #6b7280; }
</style>
</head>
<body>
  <h1>Took Logo 设计预览</h1>
  <div class="grid">

    <div class="card">
      <div class="badge">设计 1</div>
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
        <rect width="120" height="120" rx="28" fill="#0a0a0a"/>
        <rect x="30" y="32" width="60" height="12" rx="6" fill="url(#g1)"/>
        <rect x="54" y="32" width="12" height="60" rx="6" fill="url(#g1)"/>
      </svg>
      <h3>简约字母 T</h3>
      <p>纯净的字母 T 造型<br>蓝紫渐变，极简现代</p>
      <div class="sizes">
        <svg viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#0a0a0a"/><rect x="30" y="32" width="60" height="12" rx="6" fill="url(#g1)"/><rect x="54" y="32" width="12" height="60" rx="6" fill="url(#g1)"/></svg>
        <span>32px</span>
      </div>
    </div>

    <div class="card">
      <div class="badge">设计 2</div>
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
        <rect width="120" height="120" rx="28" fill="#0a0a0a"/>
        <rect x="30" y="34" width="60" height="10" rx="5" fill="url(#g2)"/>
        <rect x="55" y="34" width="10" height="56" rx="5" fill="url(#g2)"/>
        <circle cx="30" cy="39" r="5" fill="#8b5cf6"/>
        <circle cx="90" cy="39" r="5" fill="#3b82f6"/>
        <circle cx="60" cy="90" r="5" fill="#8b5cf6"/>
        <circle cx="30" cy="39" r="2.5" fill="#fff"/>
        <circle cx="90" cy="39" r="2.5" fill="#fff"/>
        <circle cx="60" cy="90" r="2.5" fill="#fff"/>
      </svg>
      <h3>科技节点 T</h3>
      <p>T 字母 + 连接节点<br>代表 AI 网关与智能连接</p>
      <div class="sizes">
        <svg viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#0a0a0a"/><rect x="30" y="34" width="60" height="10" rx="5" fill="url(#g2)"/><rect x="55" y="34" width="10" height="56" rx="5" fill="url(#g2)"/><circle cx="30" cy="39" r="5" fill="#8b5cf6"/><circle cx="90" cy="39" r="5" fill="#3b82f6"/><circle cx="60" cy="90" r="5" fill="#8b5cf6"/></svg>
        <span>32px</span>
      </div>
    </div>

    <div class="card">
      <div class="badge">设计 3</div>
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
        <rect width="120" height="120" rx="28" fill="#0a0a0a"/>
        <path d="M 30 38 Q 30 30 38 30 L 82 30 Q 90 30 90 38 L 90 42 Q 90 50 82 50 L 70 50 L 70 86 Q 70 94 62 94 L 58 94 Q 50 94 50 86 L 50 50 L 38 50 Q 30 50 30 42 Z" fill="url(#g3)"/>
      </svg>
      <h3>圆润粗体 T</h3>
      <p>圆角粗体 T 字母<br>饱满亲和，品牌感强</p>
      <div class="sizes">
        <svg viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#0a0a0a"/><path d="M 30 38 Q 30 30 38 30 L 82 30 Q 90 30 90 38 L 90 42 Q 90 50 82 50 L 70 50 L 70 86 Q 70 94 62 94 L 58 94 Q 50 94 50 86 L 50 50 L 38 50 Q 30 50 30 42 Z" fill="url(#g3)"/></svg>
        <span>32px</span>
      </div>
    </div>

    <div class="card">
      <div class="badge">设计 4</div>
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
        <rect width="120" height="120" rx="28" fill="#0a0a0a"/>
        <polygon points="60,18 102,42 102,78 60,102 18,78 18,42" fill="none" stroke="url(#g4)" stroke-width="3" opacity="0.5"/>
        <rect x="35" y="34" width="50" height="10" rx="5" fill="url(#g4)"/>
        <rect x="55" y="34" width="10" height="54" rx="5" fill="url(#g4)"/>
      </svg>
      <h3>六边形 T</h3>
      <p>六边形外框 + T 字母<br>科技感与结构感结合</p>
      <div class="sizes">
        <svg viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#0a0a0a"/><polygon points="60,18 102,42 102,78 60,102 18,78 18,42" fill="none" stroke="url(#g4)" stroke-width="3" opacity="0.5"/><rect x="35" y="34" width="50" height="10" rx="5" fill="url(#g4)"/><rect x="55" y="34" width="10" height="54" rx="5" fill="url(#g4)"/></svg>
        <span>32px</span>
      </div>
    </div>

  </div>
  <p style="text-align:center;margin-top:40px;color:#6b7280;font-size:14px">
    请告诉我你喜欢的编号（1/2/3/4），我会将它设置为项目 logo
  </p>
</body>
</html>
